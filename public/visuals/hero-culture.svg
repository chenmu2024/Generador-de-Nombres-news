<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Patrón editorial de culturas y lenguas</title>
  <desc id="desc">Composición abstracta con caracteres de distintos sistemas de escritura.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee9ff"/>
      <stop offset=".55" stop-color="#d9cff7"/>
      <stop offset="1" stop-color="#bfa8ea"/>
    </linearGradient>
    <radialGradient id="glow" cx=".18" cy=".12" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#342966" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="900" height="700" fill="url(#bg)"/>
  <rect width="900" height="700" fill="url(#glow)"/>
  <circle cx="735" cy="95" r="150" fill="#8c6fe5" opacity=".12"/>
  <circle cx="120" cy="610" r="190" fill="#fff" opacity=".22"/>
  <g filter="url(#shadow)">
    <rect x="112" y="112" width="676" height="476" rx="44" fill="#fff" fill-opacity=".78" stroke="#fff" stroke-opacity=".9"/>
    <rect x="152" y="158" width="596" height="392" rx="30" fill="#f9f7ff" stroke="#d9d0f3"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="270" y="332" font-size="118" fill="#554a9f">Aa</text>
    <text x="450" y="328" font-size="110" fill="#7a60bf">あ</text>
    <text x="625" y="326" font-size="102" fill="#9d6ab5">한</text>
    <text x="300" y="464" font-size="76" fill="#6b5cb7">Ω</text>
    <text x="450" y="466" font-size="82" fill="#4f4a8f">Ñ</text>
    <text x="602" y="468" font-size="78" fill="#8b5c9f">文</text>
  </g>
  <g fill="#6f63b3" opacity=".52">
    <circle cx="185" cy="190" r="6"/><circle cx="715" cy="190" r="6"/>
    <circle cx="185" cy="520" r="6"/><circle cx="715" cy="520" r="6"/>
  </g>
</svg>